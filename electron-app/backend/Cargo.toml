[package]
name = "research-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
cozo = { version = "0.7.6", default-features = false, features = ["rayon", "storage-sqlite", "storage-sqlite-src"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite = "0.32"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
