[package]
name = "research-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
cozo = { version = "0.7.6", default-features = false, features = ["rayon", "storage-sqlite", "storage-sqlite-src"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
libc = "0.2.189"
pdf-extract = "0.12.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
sqlite = "0.32"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "net"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
