[package]
name = "capstone-app"
version = "0.1.0"
description = "Capstone research assistant desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "capstone_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
